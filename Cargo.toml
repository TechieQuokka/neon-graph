[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/TechieQuokka/neon-graph"

[workspace.dependencies]
# Internal crates
graph = { path = "crates/graph", version = "1.0.0" }
graph-core = { path = "crates/graph-core", version = "1.0.0" }
graph-svg = { path = "crates/graph-svg", version = "1.0.0" }

# External crates (latest versions as of 2026-11-05)
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
